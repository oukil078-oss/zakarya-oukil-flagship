services:
  - type: web
    name: zakarya-oukil-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace=@zakarya/api
    startCommand: npm run start --workspace=@zakarya/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APPWRITE_ENDPOINT
        sync: false
      - key: APPWRITE_PROJECT_ID
        sync: false
      - key: APPWRITE_API_KEY
        sync: false
      - key: APPWRITE_DATABASE_ID
        value: portfolio
      - key: APPWRITE_CONTACT_COLLECTION_ID
        value: contact_messages
      - key: APPWRITE_NEWSLETTER_COLLECTION_ID
        value: newsletter_subscribers
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
